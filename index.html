<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Moldes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0b132b;
            --bg-card: #1c2541;
            --bg-table-row: #131b2e;
            --text-main: #ffffff;
            --text-muted: #8d99ae;
            --primary-blue: #2563eb;
            --accent-green: #10b981;
            --accent-yellow: #d97706;
            --accent-red: #ef4444;
            --border-color: #2a3556;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; }

        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .logo-title { display: flex; align-items: center; gap: 12px; font-size: 1.3rem; font-weight: bold; }
        .user-controls { display: flex; gap: 12px; align-items: center; }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: white; }
        .btn-blue { background-color: var(--primary-blue); }
        .btn-red { background-color: var(--accent-red); }
        .btn-green { background-color: var(--accent-green); }

        /* Dashboard Cards */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .card { background-color: var(--bg-card); border-radius: 8px; padding: 20px; display: flex; align-items: center; gap: 20px; }
        .card-icon { font-size: 1.8rem; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; }
        .card-info span { display: block; color: var(--text-muted); font-size: 0.85rem; font-weight: bold; }
        .card-info h2 { font-size: 1.8rem; margin-top: 4px; }

        /* Aba / Filtros */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background-color: var(--bg-card); color: var(--text-muted); padding: 10px 18px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .tab-btn.active { background-color: var(--primary-blue); color: white; }

        /* Toolbar */
        .toolbar { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 20px; }
        .search-box { flex: 1; position: relative; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-box input { width: 100%; background-color: var(--bg-card); border: 1px solid var(--border-color); padding: 12px 12px 12px 45px; border-radius: 6px; color: white; outline: none; }

        /* Tabela */
        .table-container { background-color: var(--bg-card); border-radius: 8px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: rgba(0,0,0,0.2); padding: 15px; color: var(--text-muted); font-size: 0.8rem; font-weight: bold; border-bottom: 1px solid var(--border-color); }
        td { padding: 15px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; vertical-align: middle; }
        tr:hover { background-color: rgba(255,255,255,0.02); }

        /* Badges e Botões da Tabela */
        .badge-aba { background-color: rgba(217, 119, 6, 0.2); color: var(--accent-yellow); padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; border: 1px solid var(--accent-yellow); display: inline-flex; align-items: center; gap: 6px; }
        .btn-liberar { background-color: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-liberar:hover { background-color: var(--accent-green); color: white; }
        .btn-action { background: none; border: none; color: white; cursor: pointer; padding: 6px; border-radius: 4px; }
        .btn-edit { background-color: var(--accent-yellow); }
        .btn-delete { background-color: var(--accent-red); }
        .date-text { color: var(--accent-green); font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">
            <i class="fa-solid fa-gear" style="color: var(--accent-red);"></i>
            <span>Gestão de Moldes</span>
        </div>
        <div class="user-controls">
            <button class="btn btn-blue"><i class="fa-solid fa-user-plus"></i> Novo Usuário</button>
            <span>Elisandro <br><small style="color: var(--text-muted)">admin</small></span>
            <button class="btn btn-red"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
        </div>
    </header>

    <div class="cards-grid">
        <div class="card">
            <div class="card-icon" style="color: var(--primary-blue);"><i class="fa-solid fa-boxes-stacked"></i></div>
            <div class="card-info">
                <span>REGISTROS NA ABA</span>
                <h2 id="total-aba">2</h2>
            </div>
        </div>
        <div class="card">
            <div class="card-icon" style="color: var(--accent-yellow);"><i class="fa-solid fa-wrench"></i></div>
            <div class="card-info">
                <span>EM FERRAMENTARIA</span>
                <h2 id="total-ferramentaria">2</h2>
            </div>
        </div>
        <div class="card">
            <div class="card-icon" style="color: var(--accent-green);"><i class="fa-solid fa-layer-group"></i></div>
            <div class="card-info">
                <span>TOTAL CADASTRADO</span>
                <h2>209</h2>
            </div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn"><i class="fa-solid fa-box"></i> Plástico</button>
        <button class="tab-btn"><i class="fa-solid fa-trash"></i> Moldes QLX</button>
        <button class="tab-btn"><i class="fa-solid fa-location-dot"></i> Sem Local</button>
        <button class="tab-btn active"><i class="fa-solid fa-wrench"></i> Ferramentaria</button>
        <button class="tab-btn"><i class="fa-solid fa-clock-rotate-left"></i> Histórico Manutenção</button>
        <button class="tab-btn"><i class="fa-solid fa-users"></i> Usuários</button>
    </div>

    <div class="toolbar">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="input-busca" placeholder="Pesquisar moldes, códigos ou locais...">
        </div>
        <button class="btn btn-green"><i class="fa-solid fa-plus"></i> Novo Molde</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>LOCAL / MOLDE N°</th>
                    <th>CÓDIGO</th>
                    <th>DESCRIÇÃO</th>
                    <th>ABA / ORIGEM</th>
                    <th>PRAZO</th>
                    <th>AÇÕES</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo">
                <!-- As linhas serão renderizadas dinamicamente via JS -->
            </tbody>
        </table>
    </div>

    <script>
        // Dados de Exemplo
        let moldes = [
            {
                id: 1,
                local: "C3",
                codigo: "00.500.252",
                descricao: "MOLLETA AGANCIO MODANATURA (BARRA DE TETO)",
                origem: "FERRAMENTARIA",
                prazo: null // Sem prazo -> exibe o botão "Liberar"
            },
            {
                id: 2,
                local: "G3",
                codigo: "00.725.432",
                descricao: "Inserto W - Arteb",
                origem: "FERRAMENTARIA",
                prazo: "18/09/2026" // Com prazo -> exibe apenas a data
            }
        ];

        function renderizarTabela() {
            const tbody = document.getElementById('tabela-corpo');
            tbody.innerHTML = '';

            moldes.forEach(item => {
                const tr = document.createElement('tr');

                // CORREÇÃO CENTRAL: Condicional que impede o botão e a data de ficarem juntos
                let conteudoPrazo = '';
                if (item.prazo) {
                    conteudoPrazo = `<span class="date-text">${item.prazo}</span>`;
                } else {
                    conteudoPrazo = `<button class="btn-liberar" onclick="liberarMolde(${item.id})">
                                        <i class="fa-solid fa-check-double"></i> Liberar
                                     </button>`;
                }

                tr.innerHTML = `
                    <td><strong>${item.local}</strong></td>
                    <td>${item.codigo}</td>
                    <td>${item.descricao}</td>
                    <td><span class="badge-aba"><i class="fa-solid fa-wrench"></i> ${item.origem}</span></td>
                    <td>${conteudoPrazo}</td>
                    <td>
                        <button class="btn-action btn-edit"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn-action btn-delete"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;

                tbody.appendChild(tr);
            });
        }

        function liberarMolde(id) {
            // Ação de liberar: remove da Ferramentaria ou limpa status
            alert(`Molde ID ${id} liberado com sucesso!`);
            moldes = moldes.filter(m => m.id !== id);
            renderizarTabela();
        }

        // Inicializar tabela ao carregar a página
        renderizarTabela();
    </script>
</body>
</html>

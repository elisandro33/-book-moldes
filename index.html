<!DOCTYPE html>
<html lang="pt-BR">
  <head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>GESTÃO DE MOLDES</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    :root {
      --bg-dark: #0f172a;
      --card-dark: #1e293b;
      --card-subtle: #182232;
      --border-color: #334155;
      --primary-blue: #2563eb;
      --primary-blue-hover: #1d4ed8;
      --success-green: #10b981;
      --success-green-hover: #059669;
      --danger-red: #ef4444;
      --danger-red-hover: #dc2626;
      --warning-amber: #f59e0b;
      --warning-amber-hover: #d97706;
      --purple-accent: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    
    /* TELA DE LOGIN ORIGINAL (INTACTA) */
    .login-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-dark); padding: 16px; }
    .login-box { background-color: var(--card-dark); padding: 32px 24px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid var(--border-color); box-shadow: 0 10px 25px rgba(0,0,0,0.4); text-align: center; }
    .login-box h2 { margin-bottom: 8px; font-size: 22px; color: var(--text-main); font-weight: 700; }
    .login-box p { margin-bottom: 24px; font-size: 14px; color: var(--text-muted); }
    
    .form-group { text-align: left; margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-muted); font-weight: 600; }
    .form-control { width: 100%; padding: 12px 14px; background-color: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 10px; color: #fff; font-size: 14px; outline: none; transition: border-color 0.2s; }
    .form-control:focus { border-color: var(--primary-blue); }
    
    .password-wrapper { position: relative; }
    .password-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted); }
    
    .btn-primary { width: 100%; padding: 12px; background-color: var(--primary-blue); color: #fff; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 15px; transition: background 0.2s; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary:hover { background-color: var(--primary-blue-hover); }
    .btn-primary:disabled { background-color: var(--border-color); cursor: not-allowed; opacity: 0.8; }
    
    .login-status { margin-top: 15px; font-size: 13px; font-weight: 600; min-height: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .login-status.loading { color: #38bdf8; }
    .login-status.error { color: #f87171; }

    /* DASHBOARD PROFISSIONAL */
    #appContainer { display: none; padding: 20px; flex-direction: column; flex-grow: 1; width: 100%; max-width: 1440px; margin: 0 auto; box-sizing: border-box; }
    
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 18px 24px; 
      background: linear-gradient(135deg, var(--card-dark) 0%, #172033 100%); 
      border-radius: 16px; 
      border: 1px solid var(--border-color); 
      margin-bottom: 20px; 
      flex-wrap: wrap; 
      gap: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    header .brand { display: flex; align-items: center; gap: 12px; }
    header .brand-icon { background: rgba(37, 99, 235, 0.2); color: #60a5fa; padding: 10px; border-radius: 12px; border: 1px solid rgba(59, 130, 246, 0.3); font-size: 20px; }
    header h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; color: var(--text-main); }
    header p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .user-info { display: flex; align-items: center; gap: 12px; }
    .user-badge { background: var(--bg-dark); padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border-color); font-weight: 500; color: var(--text-main); font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .btn-logout { padding: 8px 14px; background-color: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
    .btn-logout:hover { background-color: var(--danger-red); color: #fff; }

    /* PAINEL KPI MODERNO */
    .kpi-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .kpi-card { 
      background: var(--card-dark); 
      border: 1px solid var(--border-color); 
      border-radius: 16px; 
      padding: 18px 20px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .kpi-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
    .kpi-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
    .kpi-card.blue::before { background-color: var(--primary-blue); }
    .kpi-card.amber::before { background-color: var(--warning-amber); }
    .kpi-card.purple::before { background-color: var(--purple-accent); }
    .kpi-card.red::before { background-color: var(--danger-red); }

    .kpi-details { display: flex; flex-direction: column; }
    .kpi-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 6px; }
    .kpi-value { font-size: 28px; font-weight: 700; color: var(--text-main); }
    .kpi-icon { font-size: 28px; opacity: 0.7; padding: 12px; border-radius: 12px; }
    .kpi-card.blue .kpi-icon { color: #60a5fa; background: rgba(37, 99, 235, 0.15); }
    .kpi-card.amber .kpi-icon { color: #fbbf24; background: rgba(245, 158, 11, 0.15); }
    .kpi-card.purple .kpi-icon { color: #c084fc; background: rgba(139, 92, 246, 0.15); }
    .kpi-card.red .kpi-icon { color: #f87171; background: rgba(239, 68, 68, 0.15); }

    /* NAVEGAÇÃO E FILTROS */
    .tabs-wrapper { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 16px; flex-wrap: wrap; }
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px; background: var(--card-dark); border: 1px solid var(--border-color); border-radius: 14px; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn { padding: 10px 20px; background: transparent; color: var(--text-muted); border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
    .tab-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
    .tab-btn.active { background-color: var(--primary-blue); color: #fff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }

    /* BARRA DE AÇÕES */
    .actions-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; width: 100%; }
    .search-box { position: relative; flex-grow: 1; max-width: 100%; min-width: 250px; }
    .search-box input { width: 100%; padding: 12px 14px 12px 42px; background-color: var(--card-dark); border: 1px solid var(--border-color); border-radius: 10px; color: #fff; font-size: 14px; outline: none; transition: border-color 0.2s; }
    .search-box input:focus { border-color: var(--primary-blue); }
    .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    
    .btn-add { width: 100%; padding: 12px 20px; background-color: var(--success-green); color: #fff; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; transition: background 0.2s; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25); }
    .btn-add:hover { background-color: var(--success-green-hover); }

    @media (min-width: 640px) {
      .search-box { max-width: 360px; }
      .btn-add { width: auto; }
    }

    /* TABELA DE DADOS */
    .table-container { 
      width: 100%; 
      max-width: 100%;
      overflow-x: auto; 
      -webkit-overflow-scrolling: touch;
      background-color: var(--card-dark); 
      border-radius: 16px; 
      border: 1px solid var(--border-color); 
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25); 
    }
    
    table { width: 100%; min-width: 900px; table-layout: fixed; border-collapse: collapse; text-align: left; font-size: 14px; }
    th, td { padding: 16px; border-bottom: 1px solid var(--border-color); color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    th { background-color: #151e2e; color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background-color: rgba(255, 255, 255, 0.02); }

    .prazo-vencido { background-color: rgba(239, 68, 68, 0.12) !important; color: #fca5a5 !important; }

    /* LARGURAS DAS COLUNAS */
    .table-container:not(.table-historico):not(.table-ferram-view) th:nth-child(1), 
    .table-container:not(.table-historico):not(.table-ferram-view) td:nth-child(1) { width: 160px; }
    .table-container:not(.table-historico):not(.table-ferram-view) th:nth-child(2), 
    .table-container:not(.table-historico):not(.table-ferram-view) td:nth-child(2) { width: 220px; }
    .table-container:not(.table-historico):not(.table-ferram-view) th:nth-child(3), 
    .table-container:not(.table-historico):not(.table-ferram-view) td:nth-child(3) { width: 360px; }
    .table-container:not(.table-historico):not(.table-ferram-view) th:nth-child(4), 
    .table-container:not(.table-historico):not(.table-ferram-view) td:nth-child(4) { width: 160px; }
    .table-container:not(.table-historico):not(.table-ferram-view) th:nth-child(5), 
    .table-container:not(.table-historico):not(.table-ferram-view) td:nth-child(5) { width: 260px; text-align: center; }

    .table-container.table-ferram-view th:nth-child(1), .table-container.table-ferram-view td:nth-child(1) { width: 140px; }
    .table-container.table-ferram-view th:nth-child(2), .table-container.table-ferram-view td:nth-child(2) { width: 180px; }
    .table-container.table-ferram-view th:nth-child(3), .table-container.table-ferram-view td:nth-child(3) { width: 320px; }
    .table-container.table-ferram-view th:nth-child(4), .table-container.table-ferram-view td:nth-child(4) { width: 140px; }
    .table-container.table-ferram-view th:nth-child(5), .table-container.table-ferram-view td:nth-child(5) { width: 140px; }
    .table-container.table-ferram-view th:nth-child(6), .table-container.table-ferram-view td:nth-child(6) { width: 260px; text-align: center; }

    .table-container.table-historico table { table-layout: auto !important; min-width: 1000px !important; }
    .table-container.table-historico th, .table-container.table-historico td { width: auto !important; white-space: nowrap !important; overflow: visible !important; }

    .col-acoes { text-align: center; }
    .btn-group-acoes { display: flex; justify-content: center; gap: 8px; flex-wrap: nowrap; }

    .badge-aba { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge-plastico { background-color: rgba(37, 99, 235, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); }
    .badge-ferram { background-color: rgba(245, 158, 11, 0.2); color: #fde68a; border: 1px solid rgba(245, 158, 11, 0.4); }
    .badge-qlx { background-color: rgba(168, 85, 247, 0.2); color: #e9d5ff; border: 1px solid rgba(168, 85, 247, 0.4); }
    .badge-semlocal { background-color: rgba(107, 114, 128, 0.2); color: #e5e7eb; border: 1px solid rgba(107, 114, 128, 0.4); }

    .btn-tbl { padding: 7px 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; white-space: nowrap; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-tbl:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-ferramentaria { background-color: var(--primary-blue); color: #fff; }
    .btn-liberar { background-color: var(--success-green); color: #fff; }
    .btn-editar { background-color: var(--warning-amber); color: #fff; }
    .btn-excluir { background-color: var(--danger-red); color: #fff; }

    /* MODAIS */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal-content { background-color: var(--card-dark); padding: 24px; border-radius: 16px; width: 100%; max-width: 450px; border: 1px solid var(--border-color); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .modal-content h3 { margin-bottom: 20px; color: var(--text-main); font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
    .btn-cancelar { padding: 10px 18px; background-color: rgba(148, 163, 184, 0.15); color: var(--text-muted); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; font-weight: 600; }
    .btn-salvar { padding: 10px 18px; background-color: var(--success-green); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
</style>
  </head>
  <body>

	<!-- TELA DE LOGIN ORIGINAL (MANTIDA INTACTA) -->
	<div class="login-container" id="loginPage">
	  <div class="login-box">
		<h2>SISTEMA DE MOLDES</h2>
		<p>Digite seu Usuário e Senha para acessar</p>

		<div class="form-group">
		  <label for="userInput">Usuário</label>
		  <input type="text" id="userInput" class="form-control" placeholder="Digite seu usuário">
		</div>

		<div class="form-group">
		  <label for="passInput">Senha</label>
		  <div class="password-wrapper">
			<input type="password" id="passInput" class="form-control" placeholder="••••••••">
			<i class="fas fa-eye password-toggle" id="togglePass"></i>
		  </div>
		</div>

		<button class="btn-primary" id="btnLogin">
		  <i class="fas fa-sign-in-alt"></i> Entrar
		</button>

		<div class="login-status" id="loginStatus"></div>
	  </div>
	</div>

	<!-- SISTEMA PRINCIPAL COM DASHBOARD ATUALIZADO -->
	<div id="appContainer">
	  <header>
		<div class="brand">
		  <div class="brand-icon"><i class="fas fa-cubes"></i></div>
		  <div>
			<h1>GESTÃO DE MOLDES</h1>
			<p>Painel de Controle e Monitoramento Industrial</p>
		  </div>
		</div>
		<div class="user-info">
		  <span class="user-badge" id="userBadge"><i class="fas fa-user-circle"></i> Usuário</span>
		  <button class="btn-logout" id="btnLogout"><i class="fas fa-sign-out-alt"></i> Sair</button>
		</div>
	  </header>

	  <!-- PAINEL KPI CARDS MODERNO -->
	  <div class="kpi-container">
		<div class="kpi-card blue">
		  <div class="kpi-details">
			<div class="kpi-title">Setor Plástico</div>
			<div class="kpi-value" id="kpiPlastico">0</div>
		  </div>
		  <div class="kpi-icon"><i class="fas fa-industry"></i></div>
		</div>
		<div class="kpi-card amber">
		  <div class="kpi-details">
			<div class="kpi-title">Em Ferramentaria</div>
			<div class="kpi-value" id="kpiFerram">0</div>
		  </div>
		  <div class="kpi-icon"><i class="fas fa-tools"></i></div>
		</div>
		<div class="kpi-card purple">
		  <div class="kpi-details">
			<div class="kpi-title">Setor QLX</div>
			<div class="kpi-value" id="kpiQlx">0</div>
		  </div>
		  <div class="kpi-icon"><i class="fas fa-microscope"></i></div>
		</div>
		<div class="kpi-card red">
		  <div class="kpi-details">
			<div class="kpi-title">Manutenções Vencidas</div>
			<div class="kpi-value" id="kpiVencidas">0</div>
		  </div>
		  <div class="kpi-icon"><i class="fas fa-exclamation-triangle"></i></div>
		</div>
	  </div>

	  <!-- CONTROLES E FILTROS -->
	  <div class="tabs-wrapper">
		<div class="tabs">
		  <button class="tab-btn active" data-aba="PLASTICO"><i class="fas fa-boxes"></i> PLÁSTICO</button>
		  <button class="tab-btn" data-aba="FERRAMENTARIA"><i class="fas fa-wrench"></i> FERRAMENTARIA</button>
		  <button class="tab-btn" data-aba="QLX"><i class="fas fa-vial"></i> QLX</button>
		  <button class="tab-btn" data-aba="HISTORICO"><i class="fas fa-history"></i> HISTÓRICO MANUTENÇÃO</button>
		</div>

		<div class="actions-bar">
		  <div class="search-box">
			<i class="fas fa-search"></i>
			<input type="text" id="searchInput" placeholder="Buscar por código, ferramenta...">
		  </div>
		  <button class="btn-add" id="btnNovoMolde">
			<i class="fas fa-plus-circle"></i> Novo Molde
		  </button>
		</div>
	  </div>

	  <!-- TABELA PRINCIPAL -->
	  <div class="table-container" id="mainTableContainer">
		<table>
		  <thead>
			<tr id="tableHeader"></tr>
		  </thead>
		  <tbody id="tableBody"></tbody>
		</table>
	  </div>
	</div>

	<!-- MODAL CADASTRO / EDIÇÃO -->
	<div class="modal" id="modalMolde">
	  <div class="modal-content">
		<h3 id="modalTitle"><i class="fas fa-edit"></i> Cadastrar Molde</h3>

		<div class="form-group">
		  <label>Código do Molde</label>
		  <input type="text" id="inputCodigo" class="form-control" placeholder="Ex: M-102">
		</div>

		<div class="form-group">
		  <label>Ferramenta / Descrição</label>
		  <input type="text" id="inputFerramenta" class="form-control" placeholder="Ex: Tampa 20mm">
		</div>

		<div class="form-group">
		  <label>Observação</label>
		  <input type="text" id="inputObs" class="form-control" placeholder="Detalhes ou pendências">
		</div>

		<div class="form-group">
		  <label>Localização Inicial</label>
		  <select id="selectLocal" class="form-control">
			<option value="PLASTICO">PLÁSTICO</option>
			<option value="FERRAMENTARIA">FERRAMENTARIA</option>
			<option value="QLX">QLX</option>
		  </select>
		</div>

		<div class="modal-buttons">
		  <button class="btn-cancelar" id="btnFecharModal">Cancelar</button>
		  <button class="btn-salvar" id="btnSalvarMolde">Salvar</button>
		</div>
	  </div>
	</div>

	<!-- MODAL ENVIAR PARA FERRAMENTARIA -->
	<div class="modal" id="modalManutencao">
	  <div class="modal-content">
		<h3><i class="fas fa-tools"></i> Enviar p/ Ferramentaria</h3>

		<div class="form-group">
		  <label>Motivo da Manutenção</label>
		  <input type="text" id="inputMotivo" class="form-control" placeholder="Ex: Troca de pino guia">
		</div>

		<div class="form-group">
		  <label>Prazo de Término</label>
		  <input type="date" id="inputPrazo" class="form-control">
		</div>

		<div class="modal-buttons">
		  <button class="btn-cancelar" id="btnFecharModalManut">Cancelar</button>
		  <button class="btn-salvar" id="btnConfirmarManut">Enviar</button>
		</div>
	  </div>
	</div>

<script>
  // URL DO SEU APPS SCRIPT
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwUeuAbdmfy9Ej-i4mzHpWAUvRXMgAI35vveRyB9U2EuN3r1w5AolAHX0wMS74kVbCj/exec";

  let moldes = [];
  let abaAtual = 'PLASTICO';
  let idMoldeEmEdicao = null;
  let idMoldeEmAcao = null;

  // ELEMENTOS DOM
  const loginPage = document.getElementById('loginPage');
  const appContainer = document.getElementById('appContainer');
  const userInput = document.getElementById('userInput');
  const passInput = document.getElementById('passInput');
  const btnLogin = document.getElementById('btnLogin');
  const btnLogout = document.getElementById('btnLogout');
  const togglePass = document.getElementById('togglePass');
  const loginStatus = document.getElementById('loginStatus');

  const mainTableContainer = document.getElementById('mainTableContainer');
  const tableHeader = document.getElementById('tableHeader');
  const tableBody = document.getElementById('tableBody');
  const searchInput = document.getElementById('searchInput');

  const modalMolde = document.getElementById('modalMolde');
  const modalManutencao = document.getElementById('modalManutencao');

  // FUNÇÃO REQUISIÇÕES JSONP
  function fetchJSONP(url) {
    return new Promise((resolve, reject) => {
      const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
      window[callbackName] = function(data) {
        delete window[callbackName];
        document.body.removeChild(script);
        resolve(data);
      };
      const script = document.createElement('script');
      script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + callbackName;
      script.onerror = function() {
        delete window[callbackName];
        document.body.removeChild(script);
        reject(new Error('Falha na conexão JSONP'));
      };
      document.body.appendChild(script);
    });
  }

  // TOGGLE SENHA
  togglePass.addEventListener('click', () => {
    const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passInput.setAttribute('type', type);
    togglePass.classList.toggle('fa-eye-slash');
  });

  // AUTENTICAÇÃO
  btnLogin.addEventListener('click', autenticar);
  passInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') autenticar(); });

  async function autenticar() {
    const usuario = userInput.value.trim();
    const senha = passInput.value.trim();

    if (!usuario || !senha) {
      loginStatus.className = 'login-status error';
      loginStatus.innerText = 'Preencha usuário e senha.';
      return;
    }

    loginStatus.className = 'login-status loading';
    loginStatus.innerText = 'Verificando na planilha...';
    btnLogin.disabled = true;

    try {
      const url = `${SCRIPT_URL}?action=login&usuario=${encodeURIComponent(usuario)}&senha=${encodeURIComponent(senha)}`;

      const data = await fetchJSONP(url);

      if (data.sucesso) {
        document.getElementById('userBadge').innerHTML = `<i class="fas fa-user-circle"></i> ${data.nome || usuario}`;
        loginPage.style.display = 'none';
        appContainer.style.display = 'flex';
        carregarDadosDaPlanilha();
      } else {
        loginStatus.className = 'login-status error';
        loginStatus.innerText = data.mensagem || 'Usuário ou senha incorretos.';
      }
    } catch (err) {
      loginStatus.className = 'login-status error';
      loginStatus.innerText = 'Erro de conexão com a planilha.';
    } finally {
      btnLogin.disabled = false;
    }
  }

  btnLogout.addEventListener('click', () => {
    appContainer.style.display = 'none';
    loginPage.style.display = 'flex';
    userInput.value = '';
    passInput.value = '';
    loginStatus.innerText = '';
  });

  // CARREGAR DADOS
  async function carregarDadosDaPlanilha() {
    tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 30px;"><i class="fas fa-spinner fa-spin" style="font-size: 24px; color: var(--primary-blue);"></i><br><br>Carregando dados da planilha...</td></tr>`;
    try {
      const url = `${SCRIPT_URL}?action=getMoldes`;
      const data = await fetchJSONP(url);
      if (Array.isArray(data)) {
        moldes = data;
      } else if (data.moldes) {
        moldes = data.moldes;
      }
      renderizarSistema();
    } catch (error) {
      alert('Erro ao carregar os moldes da planilha.');
    }
  }

  // TROCA DE ABAS
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const target = e.currentTarget;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      target.classList.add('active');
      abaAtual = target.getAttribute('data-aba');
      renderizarSistema();
    });
  });

  searchInput.addEventListener('input', renderizarTabela);

  function atualizarKPIs() {
    document.getElementById('kpiPlastico').innerText = moldes.filter(m => m.localizacao === 'PLASTICO').length;
    document.getElementById('kpiFerram').innerText = moldes.filter(m => m.localizacao === 'FERRAMENTARIA').length;
    document.getElementById('kpiQlx').innerText = moldes.filter(m => m.localizacao === 'QLX').length;

    const hoje = new Date().toISOString().split('T')[0];
    const vencidas = moldes.filter(m => m.localizacao === 'FERRAMENTARIA' && m.prazo && m.prazo < hoje).length;
    document.getElementById('kpiVencidas').innerText = vencidas;
  }

  function renderizarSistema() {
    atualizarKPIs();
    renderizarTabela();
  }

  function renderizarTabela() {
    const termoBusca = searchInput.value.toLowerCase();
    tableBody.innerHTML = '';
    mainTableContainer.className = 'table-container';

    if (abaAtual === 'HISTORICO') {
      mainTableContainer.classList.add('table-historico');
      tableHeader.innerHTML = `
        <th>Código</th>
        <th>Ferramenta</th>
        <th>Origem</th>
        <th>Data Envio</th>
        <th>Motivo</th>
        <th>Prazo</th>
        <th>Data Retorno</th>
      `;

      let todosHistoricos = [];
      moldes.forEach(m => {
        if (m.historico && m.historico.length > 0) {
          m.historico.forEach(h => {
            todosHistoricos.push({ ...h, codigo: m.codigo, ferramenta: m.ferramenta });
          });
        }
      });

      const filtrados = todosHistoricos.filter(h => 
        (h.codigo && h.codigo.toLowerCase().includes(termoBusca)) || 
        (h.ferramenta && h.ferramenta.toLowerCase().includes(termoBusca)) ||
        (h.motivo && h.motivo.toLowerCase().includes(termoBusca))
      );

      if (filtrados.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--text-muted); padding:30px;">Nenhum histórico encontrado.</td></tr>`;
        return;
      }

      filtrados.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>${item.codigo}</b></td>
          <td>${item.ferramenta}</td>
          <td><span class="badge-aba badge-${item.origem ? item.origem.toLowerCase() : 'semlocal'}">${item.origem || '-'}</span></td>
          <td>${item.dataEnvio || '-'}</td>
          <td>${item.motivo || '-'}</td>
          <td>${item.prazo || '-'}</td>
          <td><span style="color: var(--success-green); font-weight:600;"><i class="fas fa-check-circle"></i> ${item.dataRetorno || '-'}</span></td>
        `;
        tableBody.appendChild(tr);
      });
      return;
    }

    if (abaAtual === 'FERRAMENTARIA') {
      mainTableContainer.classList.add('table-ferram-view');
      tableHeader.innerHTML = `
        <th>Código</th>
        <th>Ferramenta</th>
        <th>Motivo</th>
        <th>Data Envio</th>
        <th>Prazo</th>
        <th style="text-align:center;">Ações</th>
      `;
    } else {
      tableHeader.innerHTML = `
        <th>Código</th>
        <th>Ferramenta</th>
        <th>Observação</th>
        <th>Localização</th>
        <th style="text-align:center;">Ações</th>
      `;
    }

    const moldesFiltrados = moldes.filter(m => {
      const atendeAba = m.localizacao === abaAtual;
      const atendeBusca = (m.codigo && m.codigo.toLowerCase().includes(termoBusca)) || 
                           (m.ferramenta && m.ferramenta.toLowerCase().includes(termoBusca)) ||
                           (m.obs && m.obs.toLowerCase().includes(termoBusca));
      return atendeAba && atendeBusca;
    });

    if (moldesFiltrados.length === 0) {
      tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--text-muted); padding:30px;">Nenhum molde encontrado nesta aba.</td></tr>`;
      return;
    }

    const hoje = new Date().toISOString().split('T')[0];

    moldesFiltrados.forEach(m => {
      const tr = document.createElement('tr');
      const isVencido = abaAtual === 'FERRAMENTARIA' && m.prazo && m.prazo < hoje;

      if (isVencido) {
        tr.classList.add('prazo-vencido');
      }

      if (abaAtual === 'FERRAMENTARIA') {
        tr.innerHTML = `
          <td><b>${m.codigo}</b></td>
          <td>${m.ferramenta}</td>
          <td>${m.motivo || '-'}</td>
          <td>${m.dataEnvio || '-'}</td>
          <td>${m.prazo || '-'} ${isVencido ? '<i class="fas fa-exclamation-circle" title="Prazo vencido"></i>' : ''}</td>
          <td class="col-acoes">
            <div class="btn-group-acoes">
              <button class="btn-tbl btn-liberar" onclick="liberarMolde(${m.id})"><i class="fas fa-check"></i> Liberar</button>
              <button class="btn-tbl btn-editar" onclick="abrirModalEdicao(${m.id})"><i class="fas fa-edit"></i></button>
              <button class="btn-tbl btn-excluir" onclick="excluirMolde(${m.id})"><i class="fas fa-trash"></i></button>
            </div>
          </td>
        `;
      } else {
        tr.innerHTML = `
          <td><b>${m.codigo}</b></td>
          <td>${m.ferramenta}</td>
          <td>${m.obs || '-'}</td>
          <td><span class="badge-aba badge-${m.localizacao ? m.localizacao.toLowerCase() : 'semlocal'}">${m.localizacao}</span></td>
          <td class="col-acoes">
            <div class="btn-group-acoes">
              <button class="btn-tbl btn-ferramentaria" onclick="abrirModalManutencao(${m.id})"><i class="fas fa-tools"></i> Maint.</button>
              <button class="btn-tbl btn-editar" onclick="abrirModalEdicao(${m.id})"><i class="fas fa-edit"></i></button>
              <button class="btn-tbl btn-excluir" onclick="excluirMolde(${m.id})"><i class="fas fa-trash"></i></button>
            </div>
          </td>
        `;
      }
      tableBody.appendChild(tr);
    });
  }

  // MODAL CADASTRO/EDIÇÃO
  document.getElementById('btnNovoMolde').addEventListener('click', () => {
    idMoldeEmEdicao = null;
    document.getElementById('modalTitle').innerHTML = '<i class="fas fa-plus-circle"></i> Cadastrar Molde';
    document.getElementById('inputCodigo').value = '';
    document.getElementById('inputFerramenta').value = '';
    document.getElementById('inputObs').value = '';
    document.getElementById('selectLocal').value = abaAtual === 'HISTORICO' ? 'PLASTICO' : abaAtual;
    modalMolde.style.display = 'flex';
  });

  document.getElementById('btnFecharModal').addEventListener('click', () => { modalMolde.style.display = 'none'; });

  function abrirModalEdicao(id) {
    const molde = moldes.find(m => m.id === id);
    if (!molde) return;
    idMoldeEmEdicao = id;
    document.getElementById('modalTitle').innerHTML = '<i class="fas fa-edit"></i> Editar Molde';
    document.getElementById('inputCodigo').value = molde.codigo;
    document.getElementById('inputFerramenta').value = molde.ferramenta;
    document.getElementById('inputObs').value = molde.obs || '';
    document.getElementById('selectLocal').value = molde.localizacao;
    modalMolde.style.display = 'flex';
  }

  async function salvarMoldeNaPlanilha(dados) {
    const params = new URLSearchParams(dados).toString();
    const url = `${SCRIPT_URL}?action=salvarMolde&${params}`;
    return await fetchJSONP(url);
  }

  document.getElementById('btnSalvarMolde').addEventListener('click', async () => {
    const codigo = document.getElementById('inputCodigo').value.trim();
    const ferramenta = document.getElementById('inputFerramenta').value.trim();
    const obs = document.getElementById('inputObs').value.trim();
    const localizacao = document.getElementById('selectLocal').value;

    if (!codigo || !ferramenta) {
      alert('Por favor, preencha o código e a ferramenta.');
      return;
    }

    const payload = {
      id: idMoldeEmEdicao || Date.now(),
      codigo,
      ferramenta,
      obs,
      localizacao
    };

    try {
      await salvarMoldeNaPlanilha(payload);
      modalMolde.style.display = 'none';
      carregarDadosDaPlanilha();
    } catch (e) {
      alert('Erro ao salvar na planilha.');
    }
  });

  // MANUTENÇÃO
  function abrirModalManutencao(id) {
    idMoldeEmAcao = id;
    document.getElementById('inputMotivo').value = '';
    document.getElementById('inputPrazo').value = '';
    modalManutencao.style.display = 'flex';
  }

  document.getElementById('btnFecharModalManut').addEventListener('click', () => { modalManutencao.style.display = 'none'; });

  document.getElementById('btnConfirmarManut').addEventListener('click', async () => {
    const motivo = document.getElementById('inputMotivo').value.trim();
    const prazo = document.getElementById('inputPrazo').value;

    if (!motivo) {
      alert('Informe o motivo da manutenção.');
      return;
    }

    const molde = moldes.find(m => m.id === idMoldeEmAcao);
    if (molde) {
      const payload = {
        id: molde.id,
        localizacao: 'FERRAMENTARIA',
        origemAnterior: molde.localizacao,
        motivo: motivo,
        prazo: prazo,
        dataEnvio: new Date().toISOString().split('T')[0]
      };
      try {
        await salvarMoldeNaPlanilha(payload);
        modalManutencao.style.display = 'none';
        carregarDadosDaPlanilha();
      } catch (e) {
        alert('Erro ao enviar para manutenção.');
      }
    }
  });

  // LIBERAR MOLDE
  async function liberarMolde(id) {
    const molde = moldes.find(m => m.id === id);
    if (!molde) return;

    const dataHoje = new Date().toISOString().split('T')[0];
    const payload = {
      id: molde.id,
      action: 'liberarMolde',
      dataRetorno: dataHoje
    };

    try {
      const params = new URLSearchParams(payload).toString();
      await fetchJSONP(`${SCRIPT_URL}?${params}`);
      carregarDadosDaPlanilha();
    } catch (e) {
      alert('Erro ao liberar o molde.');
    }
  }

  // EXCLUIR MOLDE
  async function excluirMolde(id) {
    if (confirm('Tem certeza que deseja excluir este molde?')) {
      try {
        await fetchJSONP(`${SCRIPT_URL}?action=excluirMolde&id=${id}`);
        carregarDadosDaPlanilha();
      } catch (e) {
        alert('Erro ao excluir o molde.');
      }
    }
  }
</script>
  </body>
</html>

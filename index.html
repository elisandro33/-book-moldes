<!DOCTYPE html>
<html lang="pt-BR">
  <head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>GESTÃO DE MOLDES</title>
	<!-- Fontes e Ícones Profissionais -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --success-hover: #059669;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.3), 0 2px 4px -2px rgb(0 0 0 / 0.3);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4), 0 4px 6px -4px rgb(0 0 0 / 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: var(--bg-dark); 
      color: var(--text-main); 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* TELA DE LOGIN */
    .login-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-dark); padding: 20px; }
    .login-box { 
      background: var(--card-bg); 
      padding: 40px 30px; 
      border-radius: 16px; 
      width: 100%; 
      max-width: 400px; 
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-lg); 
      text-align: center; 
    }
    .login-box .logo-icon {
      width: 50px;
      height: 50px;
      background: rgba(59, 130, 246, 0.1);
      color: var(--primary);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 15px;
    }
    .login-box h2 { margin-bottom: 8px; font-size: 22px; font-weight: 700; color: var(--text-main); }
    .login-box p { margin-bottom: 24px; font-size: 14px; color: var(--text-muted); }
    
    .form-group { text-align: left; margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
    .form-control { 
      width: 100%; 
      padding: 12px 14px; 
      background-color: #0f172a; 
      border: 1px solid var(--card-border); 
      border-radius: 8px; 
      color: #fff; 
      font-size: 14px; 
      outline: none; 
      transition: all 0.2s ease-in-out;
    }
    .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
    
    .password-wrapper { position: relative; }
    .password-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted); transition: color 0.2s; }
    .password-toggle:hover { color: var(--text-main); }

    .btn-primary { 
      width: 100%; 
      padding: 12px; 
      background: linear-gradient(135deg, var(--primary), var(--primary-hover)); 
      color: #fff; 
      border: none; 
      border-radius: 8px; 
      font-weight: 600; 
      cursor: pointer; 
      font-size: 15px; 
      transition: all 0.2s ease-in-out; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    
    .login-status { margin-top: 15px; font-size: 13px; font-weight: 500; min-height: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .login-status.loading { color: #38bdf8; }
    .login-status.error { color: #f87171; }

    /* SISTEMA PRINCIPAL LAYOUT */
    #appContainer { display: none; flex-direction: column; min-height: 100vh; background-color: var(--bg-dark); }
    
    /* HEADER NAVBAR */
    header { 
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 24px;
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }
    .header-brand { display: flex; align-items: center; gap: 12px; }
    .header-brand h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; color: var(--text-main); }
    
    .user-info { display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--card-border); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--text-muted); }
    .user-details { display: flex; flex-direction: column; text-align: right; }
    .user-name { font-size: 13px; font-weight: 600; color: var(--text-main); }
    .user-role { font-size: 11px; color: var(--text-muted); }
    
    .btn-user-add { padding: 8px 12px; background-color: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s ease-in-out; display: none; align-items: center; gap: 6px; }
    .btn-user-add:hover { background-color: var(--primary); color: #fff; }

    .btn-logout { padding: 8px 12px; background-color: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s ease-in-out; }
    .btn-logout:hover { background-color: var(--danger); color: #fff; }

    /* CONTEÚDO PRINCIPAL */
    .main-content { padding: 24px; max-width: 1400px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 20px; flex-grow: 1; }

    /* CARDS DE RESUMO KPI */
    .kpi-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .kpi-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .kpi-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .kpi-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .kpi-icon.blue { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .kpi-icon.amber { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .kpi-icon.emerald { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .kpi-details { display: flex; flex-direction: column; }
    .kpi-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .kpi-value { font-size: 22px; font-weight: 700; color: var(--text-main); margin-top: 2px; }

    /* NAVEGAÇÃO POR ABAS */
    .tabs-wrapper { overflow-x: auto; padding-bottom: 4px; }
    .tabs-wrapper::-webkit-scrollbar { height: 4px; }
    .tabs-wrapper::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }
    
    .tabs { display: flex; gap: 8px; min-width: max-content; }
    .tab-btn { 
      padding: 10px 18px; 
      background-color: var(--card-bg); 
      color: var(--text-muted); 
      border: 1px solid var(--card-border); 
      border-radius: 10px; 
      cursor: pointer; 
      font-weight: 500; 
      font-size: 13px; 
      white-space: nowrap; 
      transition: all 0.2s ease-in-out;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tab-btn:hover { background-color: #26334d; color: var(--text-main); }
    .tab-btn.active { 
      background: linear-gradient(135deg, var(--primary), var(--primary-hover)); 
      color: #fff; 
      border-color: transparent; 
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    /* BARRA DE AÇÕES E PESQUISA */
    .actions-bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .search-box { position: relative; flex: 1; min-width: 280px; }
    .search-box input { 
      width: 100%; 
      padding: 12px 16px 12px 42px; 
      background-color: var(--card-bg); 
      border: 1px solid var(--card-border); 
      border-radius: 10px; 
      color: #fff; 
      font-size: 14px; 
      outline: none; 
      transition: all 0.2s ease-in-out;
      box-shadow: var(--shadow-sm);
    }
    .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
    .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 15px; }

    .btn-add { 
      padding: 12px 20px; 
      background: linear-gradient(135deg, var(--success), var(--success-hover)); 
      color: #fff; 
      border: none; 
      border-radius: 10px; 
      font-weight: 600; 
      font-size: 14px;
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
      transition: all 0.2s ease-in-out;
    }
    .btn-add:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35); }

    /* TABELA DESIGN PROFISSIONAL */
    .table-container { 
      width: 100%; 
      overflow-x: auto; 
      background-color: var(--card-bg); 
      border-radius: 14px; 
      border: 1px solid var(--card-border); 
      box-shadow: var(--shadow-md); 
    }
    
    table { 
      width: 100%; 
      border-collapse: collapse; 
      text-align: left; 
      font-size: 14px; 
    }
    
    th { 
      background-color: #141e30; 
      color: var(--text-muted); 
      font-weight: 600; 
      text-transform: uppercase; 
      font-size: 11px; 
      letter-spacing: 0.8px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      white-space: nowrap;
    }
    
    td { 
      padding: 16px 20px; 
      border-bottom: 1px solid var(--card-border); 
      color: var(--text-main); 
      white-space: nowrap; 
      transition: background-color 0.2s ease;
    }
    
    tr:last-child td { border-bottom: none; }
    tr:hover td { background-color: rgba(255, 255, 255, 0.03); }

    /* DESTAQUE DE PRAZO VENCIDO */
    .prazo-vencido { background-color: rgba(239, 68, 68, 0.12) !important; }
    .prazo-vencido td { color: #fca5a5 !important; }

    /* AJUSTES DE COLUNAS */
    .col-prazo { width: 130px; text-align: center; font-weight: 600; }
    .col-acoes { text-align: right; white-space: nowrap; width: 1%; }

    /* AJUSTES ESPECÍFICOS DA TABELA DE HISTÓRICO */
    table.tabela-historico { table-layout: auto !important; min-width: 1100px; }
    table.tabela-historico th, table.tabela-historico td { white-space: normal !important; word-wrap: break-word; max-width: 280px; }

    .btn-group-acoes { display: flex; justify-content: flex-end; align-items: center; gap: 8px; flex-wrap: nowrap; }

    /* BADGES */
    .badge-aba { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
    .badge-plastico { background-color: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .badge-ferram { background-color: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-qlx { background-color: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    .badge-semlocal { background-color: rgba(100, 116, 139, 0.15); color: #94a3b8; border: 1px solid rgba(100, 116, 139, 0.3); }

    /* BOTOES DE AÇÃO DA TABELA */
    .btn-tbl { padding: 7px 12px; border: none; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; white-space: nowrap; transition: all 0.2s ease-in-out; display: inline-flex; align-items: center; gap: 6px; }
    .btn-ferramentaria { background-color: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .btn-ferramentaria:hover { background-color: var(--primary); color: #fff; }
    .btn-liberar { background-color: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .btn-liberar:hover { background-color: var(--success); color: #fff; }
    .btn-editar { background-color: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .btn-editar:hover { background-color: var(--warning); color: #fff; }
    .btn-excluir { background-color: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-excluir:hover { background-color: var(--danger); color: #fff; }

    /* MODAIS REFINADOS */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal-content { background-color: var(--card-bg); border: 1px solid var(--card-border); padding: 28px; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: var(--shadow-lg); animation: modalFadeIn 0.2s ease-out; }
    @keyframes modalFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .modal-content h3 { margin-bottom: 20px; color: var(--text-main); font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
    .btn-cancelar { padding: 10px 18px; background-color: transparent; color: var(--text-muted); border: 1px solid var(--card-border); border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 14px; transition: all 0.2s ease-in-out; }
    .btn-cancelar:hover { background-color: rgba(255,255,255,0.05); color: var(--text-main); }
    .btn-salvar { padding: 10px 18px; background: linear-gradient(135deg, var(--success), var(--success-hover)); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); transition: all 0.2s ease-in-out; }
    .btn-salvar:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(16, 185, 129, 0.3); }

    /* RESPONSIVIDADE MOBILE */
    @media (max-width: 768px) {
      header { padding: 12px 16px; }
      .header-brand h1 { font-size: 16px; }
      .main-content { padding: 16px; }
      .actions-bar { flex-direction: column; align-items: stretch; }
      .search-box { min-width: 100%; }
      .btn-add { justify-content: center; width: 100%; }

      .table-container { background: transparent; border: none; box-shadow: none; }
      table, thead, tbody, th, td, tr { display: block; }
      thead tr { position: absolute; top: -9999px; left: -9999px; }
      
      tbody tr {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        margin-bottom: 12px;
        padding: 14px;
        box-shadow: var(--shadow-sm);
      }

      td {
        padding: 6px 0;
        border: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        white-space: normal;
        width: 100% !important;
      }

      td::before {
        content: attr(data-label);
        font-weight: 600;
        color: var(--text-muted);
        font-size: 11px;
        text-transform: uppercase;
        margin-right: 12px;
      }

      td.col-acoes {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--card-border);
        justify-content: flex-end;
      }

      .btn-group-acoes { width: 100%; justify-content: flex-end; }
    }
</style>
  </head>
  <body>

	<!-- TELA DE LOGIN -->
	<div id="loginScreen" class="login-container">
	  <div class="login-box">
		<div class="logo-icon">
		  <img src="https://raw.githubusercontent.com/elisandro33/-book-moldes/refs/heads/main/logo.png" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;">
		</div>
		<h2>Acesso ao Sistema</h2>
		<p>Gestão Inteligente de Moldes</p>

		<form onsubmit="event.preventDefault(); efetuarLogin();">
		  <div class="form-group">
			<label for="loginUser">Usuário</label>
			<input type="text" id="loginUser" class="form-control" placeholder="Digite seu usuário..." autocomplete="off">
		  </div>

		  <div class="form-group">
			<label for="loginPass">Senha</label>
			<div class="password-wrapper">
			  <input type="password" id="loginPass" class="form-control" placeholder="••••••••">
			  <i class="fa fa-eye password-toggle" onclick="toggleSenha('loginPass')"></i>
			</div>
		  </div>

		  <button type="submit" id="btnLogin" class="btn-primary">Entrar no Sistema</button>
		</form>

		<div id="loginStatus" class="login-status"></div>
	  </div>
	</div>

	<!-- SISTEMA PRINCIPAL -->
	<div id="appContainer">
	  <header>
		<div class="header-brand">
		  <div style="width: 40px; height: 40px; min-width: 40px; flex-shrink: 0;">
			<img src="https://raw.githubusercontent.com/elisandro33/-book-moldes/refs/heads/main/logo.png" 
			  alt="Logo" 
			  style="width: 100%; height: 100%; object-fit: contain;">
		  </div>
		  <h1>Gestão de Moldes</h1>
		</div>
		<div class="user-info">
		  <button id="btnCadastrarUsuario" onclick="abrirModalCadastrarUsuario()" class="btn-user-add" title="Cadastrar novo usuário">
		    <i class="fa-solid fa-user-plus"></i> Novo Usuário
		  </button>
		  <div class="user-avatar">
			<i class="fa-solid fa-user"></i>
		  </div>
		  <div class="user-details">
			<span class="user-name" id="lblUsuario">--</span>
			<span class="user-role" id="lblRole">--</span>
		  </div>
		  <button onclick="logout()" class="btn-logout" title="Sair do sistema"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
		</div>
	  </header>

	  <main class="main-content">
		<!-- CARDS DE RESUMO KPI -->
		<div class="kpi-container">
		  <div class="kpi-card">
		    <div class="kpi-icon blue"><i class="fa-solid fa-boxes-stacked"></i></div>
		    <div class="kpi-details">
		      <span class="kpi-label">Registros na Aba</span>
		      <span class="kpi-value" id="kpiTotalAba">0</span>
		    </div>
		  </div>
		  <div class="kpi-card">
		    <div class="kpi-icon amber"><i class="fa-solid fa-wrench"></i></div>
		    <div class="kpi-details">
		      <span class="kpi-label">Em Ferramentaria</span>
		      <span class="kpi-value" id="kpiFerramentaria">0</span>
		    </div>
		  </div>
		  <div class="kpi-card">
		    <div class="kpi-icon emerald"><i class="fa-solid fa-layer-group"></i></div>
		    <div class="kpi-details">
		      <span class="kpi-label">Total Cadastrado</span>
		      <span class="kpi-value" id="kpiTotalGeral">0</span>
		    </div>
		  </div>
		</div>

		<!-- ABAS COM ROLAGEM SUAVE -->
		<div class="tabs-wrapper">
		  <div class="tabs" id="tabContainer">
			<button id="tabPlastico" class="tab-btn tab-admin" onclick="trocarAba('ATUALIZADA', this)"><i class="fa-solid fa-industry"></i> Plástico</button>
			<button id="tabQLX" class="tab-btn tab-admi

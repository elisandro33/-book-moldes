<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GESTÃO DE MOLDES</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121824; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; }
    
    /* TELA DE LOGIN */
    .login-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #121824; }
    .login-box { background-color: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    .login-box h2 { margin-bottom: 20px; font-size: 22px; color: #f8fafc; }
    .login-box p { margin-bottom: 20px; font-size: 14px; color: #94a3b8; }
    
    .form-group { text-align: left; margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 13px; color: #cbd5e1; font-weight: 600; }
    .form-control { width: 100%; padding: 10px 12px; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
    .form-control:focus { border-color: #3b82f6; }
    
    .password-wrapper { position: relative; }
    .password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #94a3b8; }
    
    .btn-primary { width: 100%; padding: 12px; background-color: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px; transition: background 0.2s; margin-top: 10px; }
    .btn-primary:hover { background-color: #1d4ed8; }
    
    /* SISTEMA PRINCIPAL */
    #appContainer { display: none; padding: 20px; flex-direction: column; flex-grow: 1; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #334155; margin-bottom: 20px; }
    header h1 { font-size: 22px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; }
    .user-info { display: flex; align-items: center; gap: 15px; font-size: 14px; color: #cbd5e1; }
    .btn-logout { padding: 6px 14px; background-color: #991b1b; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn-logout:hover { background-color: #7f1d1d; }

    /* NAVEGAÇÃO POR ABAS */
    .tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
    .tab-btn { padding: 10px 18px; background-color: #1e293b; color: #94a3b8; border: 1px solid #334155; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap; transition: all 0.2s; }
    .tab-btn.active { background-color: #1d4ed8; color: #fff; border-color: #2563eb; }

    /* BARRA DE AÇÕES */
    .actions-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px; flex-wrap: wrap; }
    .search-box { position: relative; flex-grow: 1; max-width: 300px; }
    .search-box input { width: 100%; padding: 10px 12px 10px 35px; background-color: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
    .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #64748b; }
    .btn-add { padding: 10px 18px; background-color: #059669; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .btn-add:hover { background-color: #047857; }

    /* TABELA DE DADOS */
    .table-container { overflow-x: auto; background-color: #1e293b; border-radius: 8px; border: 1px solid #334155; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th { background-color: #0f172a; color: #64748b; padding: 14px; font-weight: 700; text-transform: uppercase; font-size: 12px; border-bottom: 1px solid #334155; white-space: nowrap; }
    td { padding: 14px; border-bottom: 1px solid #334155; color: #cbd5e1; white-space: nowrap; }
    tr:hover { background-color: #26334d; }

    /* BOTOES DE AÇÃO DA TABELA */
    .btn-tbl { padding: 6px 12px; border: none; border-radius: 4px; font-weight: 600; font-size: 12px; cursor: pointer; margin-right: 5px; }
    .btn-ferramentaria { background-color: #1d4ed8; color: #fff; }
    .btn-liberar { background-color: #059669; color: #fff; }
    .btn-editar { background-color: #ca8a04; color: #fff; }
    .btn-excluir { background-color: #dc2626; color: #fff; }

    /* MODAIS */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 100; }
    .modal-content { background-color: #1e293b; padding: 25px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .modal-content h3 { margin-bottom: 20px; color: #f8fafc; font-size: 18px; display: flex; align-items: center; gap: 10px; }
    .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .btn-cancelar { padding: 8px 16px; background-color: #475569; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    .btn-salvar { padding: 8px 16px; background-color: #10b981; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="loginScreen" class="login-container">
    <div class="login-box">
      <h2>🔑 Acesso ao Sistema</h2>
      <p>Digite seu usuário e senha para acessar</p>
      
      <div class="form-group">
        <label for="loginUser">Usuário</label>
        <input type="text" id="loginUser" class="form-control" placeholder="Digite seu usuário..." autocomplete="off">
      </div>

      <div class="form-group">
        <label for="loginPass">Senha</label>
        <div class="password-wrapper">
          <input type="password" id="loginPass" class="form-control" placeholder="••••••••">
          <i class="fa fa-eye password-toggle" onclick="toggleSenha()"></i>
        </div>
      </div>

      <button onclick="efetuarLogin()" class="btn-primary">Entrar</button>
    </div>
  </div>

  <!-- SISTEMA PRINCIPAL -->
  <div id="appContainer">
    <header>
      <h1>Gestão de Moldes</h1>
      <div class="user-info">
        <span>Usuário: <strong id="lblUsuario">--</strong> (<span id="lblRole">--</span>)</span>
        <button onclick="logout()" class="btn-logout">Sair</button>
      </div>
    </header>

    <!-- ABAS DINÂMICAS -->
    <div class="tabs" id="tabContainer">
      <button class="tab-btn tab-admin active" onclick="trocarAba('ATUALIZADA', this)">Plástico (ATUALIZADA)</button>
      <button class="tab-btn tab-admin" onclick="trocarAba('Moldes QLX', this)">Moldes QLX</button>
      <button class="tab-btn tab-admin" onclick="trocarAba('Sem local', this)">Sem Local</button>
      <button class="tab-btn tab-ferram" onclick="trocarAba('ferramentaria', this)">Ferramentaria</button>
      <button class="tab-btn tab-ferram" onclick="trocarAba('HISTORICO_MANUTENCAO', this)">Histórico Manutenção</button>
    </div>

    <!-- AÇÕES -->
    <div class="actions-bar">
      <div class="search-box">
        <i class="fa fa-search"></i>
        <input type="text" id="txtBusca" placeholder="Buscar molde, código..." onkeyup="filtrarTabela()">
      </div>
      <button class="btn-add" id="btnAddMolde" onclick="abrirModalAdicionar()"><i class="fa fa-plus"></i> Adicionar Molde</button>
    </div>

    <!-- TABELA -->
    <div class="table-container">
      <table>
        <thead id="tblHead">
          <tr>
            <th>Local / Molde N°</th>
            <th>Código</th>
            <th>Descrição</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tblBody">
          <tr><td colspan="4" style="text-align:center;">Selecione uma aba...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- MODAL: ADICIONAR MOLDE -->
  <div id="modalAdicionarMolde" class="modal">
    <div class="modal-content">
      <h3><i class="fa fa-plus"></i> Adicionar Molde</h3>
      
      <div class="form-group">
        <label for="addAbaDestino">Destino (Aba):</label>
        <select id="addAbaDestino" class="form-control">
          <option value="ATUALIZADA">Plástico (ATUALIZADA)</option>
          <option value="Moldes QLX">Moldes QLX</option>
          <option value="Sem local">Sem Local</option>
        </select>
      </div>

      <div class="form-group">
        <label for="addLocal">Local / Molde N°:</label>
        <input type="text" id="addLocal" class="form-control" placeholder="Ex: A1, MOD-058...">
      </div>

      <div class="form-group">
        <label for="addCodigo">Código:</label>
        <input type="text" id="addCodigo" class="form-control" placeholder="Código do molde">
      </div>

      <div class="form-group">
        <label for="addDescricao">Descrição:</label>
        <input type="text" id="addDescricao" class="form-control" placeholder="Descrição da peça / molde">
      </div>

      <div class="modal-buttons">
        <button onclick="fecharModalAdicionar()" class="btn-cancelar">Cancelar</button>
        <button onclick="salvarNovoMolde()" class="btn-salvar">Salvar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: EDITAR MOLDE -->
  <div id="modalEditarMolde" class="modal">
    <div class="modal-content">
      <h3><i class="fa fa-pencil"></i> Editar Molde</h3>
      <input type="hidden" id="editRowIndex">
      
      <div class="form-group">
        <label for="editLocal">Local / Molde N°:</label>
        <input type="text" id="editLocal" class="form-control">
      </div>

      <div class="form-group">
        <label for="editCodigo">Código:</label>
        <input type="text" id="editCodigo" class="form-control">
      </div>

      <div class="form-group">
        <label for="editDescricao">Descrição:</label>
        <input type="text" id="editDescricao" class="form-control">
      </div>

      <div class="modal-buttons">
        <button onclick="fecharModalEditar()" class="btn-cancelar">Cancelar</button>
        <button onclick="salvarEdicaoMolde()" class="btn-salvar">Salvar Alterações</button>
      </div>
    </div>
  </div>

  <!-- MODAL: SOLICITAR FERRAMENTARIA -->
  <div id="modalFerramentaria" class="modal">
    <div class="modal-content">
      <h3><i class="fa fa-wrench"></i> Solicitar Ferramentaria</h3>
      <input type="hidden" id="ferrRowIndex">
      <input type="hidden" id="ferrLocal">
      <input type="hidden" id="ferrCodigo">
      <input type="hidden" id="ferrDescricao">

      <div class="form-group">
        <label for="ferrData">Data Entrada:</label>
        <input type="date" id="ferrData" class="form-control">
      </div>

      <div class="form-group">
        <label for="ferrHora">Hora Entrada:</label>
        <input type="time" id="ferrHora" class="form-control">
      </div>

      <div class="form-group">
        <label for="ferrSolicitante">Solicitante:</label>
        <input type="text" id="ferrSolicitante" class="form-control" placeholder="Nome do solicitante">
      </div>

      <div class="form-group">
        <label for="ferrTipos">Tipo de Serviço:</label>
        <input type="text" id="ferrTipos" class="form-control" placeholder="Ex: Manutenção Corretiva, Ajuste...">
      </div>

      <div class="form-group">
        <label for="ferrObs">Observação / Problema:</label>
        <textarea id="ferrObs" class="form-control" rows="3" placeholder="Detalhes do problema..."></textarea>
      </div>

      <div class="modal-buttons">
        <button onclick="fecharModalFerramentaria()" class="btn-cancelar">Cancelar</button>
        <button onclick="confirmarEnvioFerramentaria()" class="btn-salvar">Enviar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: LIBERAR PARA O PLÁSTICO (Ação Realizada) -->
  <div id="modalLiberarPlastico" class="modal">
    <div class="modal-content">
      <h3><i class="fa fa-check-circle"></i> Liberar P/ Plástico</h3>
      <input type="hidden" id="libRowIndex">
      
      <div class="form-group">
        <label for="libDataSaida">Data de Saída:</label>
        <input type="date" id="libDataSaida" class="form-control">
      </div>

      <div class="form-group">
        <label for="libHoraSaida">Hora de Saída:</label>
        <input type="time" id="libHoraSaida" class="form-control">
      </div>

      <div class="form-group">
        <label for="libTecnico">Técnico / Responsável:</label>
        <input type="text" id="libTecnico" class="form-control" placeholder="Nome do responsável">
      </div>

      <div class="form-group">
        <label for="libAcaoRealizada">Ação / Manutenção Realizada:</label>
        <textarea id="libAcaoRealizada" class="form-control" rows="3" placeholder="Descreva os reparos ou ajustes feitos..."></textarea>
      </div>

      <div class="modal-buttons">
        <button onclick="fecharModalLiberar()" class="btn-cancelar">Cancelar</button>
        <button onclick="confirmarLiberacaoPlastico()" class="btn-salvar">Confirmar Liberação</button>
      </div>
    </div>
  </div>

  <script>
    const BASE_API = "https://script.google.com/macros/s/AKfycbwUeuAbdmfy9Ej-i4mzHpWAUvRXMgAI35vveRyB9U2EuN3r1w5AolAHX0wMS74kVbCj/exec";
    
    let usuarioLogado = null;
    let abaAtual = "ATUALIZADA";
    let dadosAbaAtual = [];

    function executarJSONP(url) {
      const script = document.createElement('script');
      script.src = url;
      script.onerror = () => alert("Erro de conexão ao acessar o servidor Google Apps Script.");
      document.body.appendChild(script);
      script.onload = () => document.body.removeChild(script);
    }

    function toggleSenha() {
      const passInput = document.getElementById("loginPass");
      passInput.type = passInput.type === "password" ? "text" : "password";
    }

    function efetuarLogin() {
      const u = document.getElementById("loginUser").value.trim();
      const p = document.getElementById("loginPass").value.trim();

      if (!u || !p) {
        alert("Informe o usuário e a senha!");
        return;
      }

      const url = `${BASE_API}?action=LOGIN&user=${encodeURIComponent(u)}&pass=${encodeURIComponent(p)}&callback=retornoLogin`;
      executarJSONP(url);
    }

    function retornoLogin(res) {
      if (res && res.status === "success") {
        usuarioLogado = res;
        document.getElementById("lblUsuario").innerText = res.user;
        document.getElementById("lblRole").innerText = res.role;
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("appContainer").style.display = "flex";

        // REGRA DE PERMISSÕES POR USUÁRIO
        const isFerram = (res.user.toLowerCase() === "ferramentaria" || res.role.toLowerCase() === "ferramentaria");

        if (isFerram) {
          // Esconde abas de admin/fábrica
          document.querySelectorAll(".tab-admin").forEach(el => el.style.display = "none");
          document.getElementById("btnAddMolde").style.display = "none";
          // Seleciona diretamente a aba Ferramentaria
          const btnFerram = document.querySelector(".tab-ferram");
          trocarAba('ferramentaria', btnFerram);
        } else {
          // Usuário normal/Admin vê tudo
          document.querySelectorAll(".tab-admin").forEach(el => el.style.display = "inline-block");
          document.getElementById("btnAddMolde").style.display = "flex";
          const btnAtual = document.querySelector(".tab-admin");
          trocarAba('ATUALIZADA', btnAtual);
        }

      } else {
        alert("Erro no login: " + (res.message || "Usuário ou senha incorretos."));
      }
    }

    function logout() {
      usuarioLogado = null;
      document.getElementById("appContainer").style.display = "none";
      document.getElementById("loginScreen").style.display = "flex";
      document.getElementById("loginPass").value = "";
    }

    function trocarAba(nomeAba, btn) {
      abaAtual = nomeAba;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
      
      const selectDestino = document.getElementById("addAbaDestino");
      if (["ATUALIZADA", "Moldes QLX", "Sem local"].includes(nomeAba)) {
        selectDestino.value = nomeAba;
      }

      carregarDadosAba(nomeAba);
    }

    function carregarDadosAba(nomeAba) {
      const tbody = document.getElementById("tblBody");
      tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;">Carregando dados de ${nomeAba}...</td></tr>`;
      
      const url = `${BASE_API}?action=GET_DATA&sheet=${encodeURIComponent(nomeAba)}&callback=retornoCarregarDados`;
      executarJSONP(url);
    }

    function retornoCarregarDados(res) {
      dadosAbaAtual = Array.isArray(res) ? res : [];
      renderizarTabela(dadosAbaAtual);
    }

    function normalizarString(str) {
      if (!str) return "";
      return String(str)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-0]/g, "");
    }

    function obterValorColuna(item, nomesPossiveis, indicePadrao) {
      const keys = Object.keys(item).filter(k => k !== '_rowIndex');

      for (let key of keys) {
        let keyNorm = normalizarString(key);
        for (let nome of nomesPossiveis) {
          if (keyNorm === normalizarString(nome)) {
            return item[key] || "";
          }
        }
      }

      if (typeof indicePadrao === 'number' && keys[indicePadrao] !== undefined) {
        return item[keys[indicePadrao]] || "";
      }

      return "";
    }

    function renderizarTabela(dados) {
      const thead = document.getElementById("tblHead");
      const tbody = document.getElementById("tblBody");
      tbody.innerHTML = "";

      // MODO HISTÓRICO DE MANUTENÇÃO
      if (abaAtual === "HISTORICO_MANUTENCAO") {
        if (!dados || dados.length === 0) {
          thead.innerHTML = `<tr><th>Informação</th></tr>`;
          tbody.innerHTML = `<tr><td style="text-align:center;">Nenhum histórico encontrado.</td></tr>`;
          return;
        }

        const colunas = Object.keys(dados[0]).filter(k => k !== '_rowIndex');
        let headerHTML = "<tr>";
        colunas.forEach(col => headerHTML += `<th>${col}</th>`);
        headerHTML += "</tr>";
        thead.innerHTML = headerHTML;

        dados.forEach(item => {
          const tr = document.createElement("tr");
          let rowHTML = "";
          colunas.forEach(col => {
            rowHTML += `<td>${item[col] || ""}</td>`;
          });
          tr.innerHTML = rowHTML;
          tbody.appendChild(tr);
        });
        return;
      }

      // MODO ABAS PADRÃO (Plástico, QLX, Sem Local, Ferramentaria)
      thead.innerHTML = `
        <tr>
          <th>Local / Molde N°</th>
          <th>Código</th>
          <th>Descrição</th>
          <th>Ações</th>
        </tr>
      `;

      if (!dados || dados.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Nenhum registro encontrado.</td></tr>`;
        return;
      }

      dados.forEach((item, index) => {
        const tr = document.createElement("tr");
        
        const col1 = obterValorColuna(item, ["LOCAL", "Local", "molde número", "molde numero", "molde", "numero"], 0);
        const col2 = obterValorColuna(item, ["CÓDIGO", "Código", "CODIGO", "código", "codigo"], 1);
        const col3 = obterValorColuna(item, ["DESCRIÇÃO", "Descrição", "DESCRICAO", "descrição", "descricao"], 2);

        // Se for na aba Ferramentaria, exibe o botão "Liberar P/ Plástico"
        let btnAcaoPrincipal = `<button class="btn-tbl btn-ferramentaria" onclick="abrirModalFerramentaria(${index})">Ferramentaria</button>`;
        if (abaAtual === "ferramentaria") {
          btnAcaoPrincipal = `<button class="btn-tbl btn-liberar" onclick="abrirModalLiberar(${index})">Liberar P/ Plástico</button>`;
        }

        tr.innerHTML = `
          <td>${col1}</td>
          <td>${col2}</td>
          <td>${col3}</td>
          <td>
            ${btnAcaoPrincipal}
            <button class="btn-tbl btn-editar" onclick="abrirModalEditar(${index})">Editar</button>
            <button class="btn-tbl btn-excluir" onclick="excluirMolde(${index})">Excluir</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filtrarTabela() {
      const termo = document.getElementById("txtBusca").value.toLowerCase();
      const filtrados = dadosAbaAtual.filter(item => {
        return Object.values(item).some(val => String(val).toLowerCase().includes(termo));
      });
      renderizarTabela(filtrados);
    }

    /* --- LIBERAR PARA PLÁSTICO (MODAL DE AÇÃO) --- */
    function abrirModalLiberar(index) {
      const item = dadosAbaAtual[index];
      if (!item) return;

      document.getElementById("libRowIndex").value = item._rowIndex;
      
      const agora = new Date();
      document.getElementById("libDataSaida").value = agora.toISOString().split('T')[0];
      document.getElementById("libHoraSaida").value = agora.toTimeString().substring(0,5);
      
      if (usuarioLogado) {
        document.getElementById("libTecnico").value = usuarioLogado.user || "";
      }

      document.getElementById("modalLiberarPlastico").style.display = "flex";
    }

    function fecharModalLiberar() {
      document.getElementById("modalLiberarPlastico").style.display = "none";
      document.getElementById("libAcaoRealizada").value = "";
    }

    function confirmarLiberacaoPlastico() {
      const rIndex = document.getElementById("libRowIndex").value;
      const dataSaida = document.getElementById("libDataSaida").value;
      const horaSaida = document.getElementById("libHoraSaida").value;
      const tecnico = document.getElementById("libTecnico").value.trim();
      const acaoRealizada = document.getElementById("libAcaoRealizada").value.trim();

      if (!acaoRealizada) {
        alert("Por favor, descreva a ação ou manutenção realizada!");
        return;
      }

      const url = `${BASE_API}?action=LIBERAR_FERRAMENTARIA` +
                  `&rowIndex=${rIndex}` +
                  `&dataSaida=${encodeURIComponent(dataSaida)}` +
                  `&horaSaida=${encodeURIComponent(horaSaida)}` +
                  `&tecnico=${encodeURIComponent(tecnico)}` +
                  `&acaoRealizada=${encodeURIComponent(acaoRealizada)}` +
                  `&callback=retornoAcao`;

      executarJSONP(url);
    }

    /* --- ADICIONAR MOLDE --- */
    function abrirModalAdicionar() {
      document.getElementById("modalAdicionarMolde").style.display = "flex";
    }

    function fecharModalAdicionar() {
      document.getElementById("modalAdicionarMolde").style.display = "none";
      document.getElementById("addLocal").value = "";
      document.getElementById("addCodigo").value = "";
      document.getElementById("addDescricao").value = "";
    }

    function salvarNovoMolde() {
      const aba = document.getElementById("addAbaDestino").value;
      const col1 = document.getElementById("addLocal").value.trim();
      const col2 = document.getElementById("addCodigo").value.trim();
      const col3 = document.getElementById("addDescricao").value.trim();

      if (!col1 || !col2 || !col3) {
        alert("Por favor, preencha todos os campos!");
        return;
      }

      const url = `${BASE_API}?action=ADICIONAR_MOLDE&sheet=${encodeURIComponent(aba)}&col1=${encodeURIComponent(col1)}&col2=${encodeURIComponent(col2)}&col3=${encodeURIComponent(col3)}&callback=retornoAcao`;
      executarJSONP(url);
    }

    /* --- EDITAR MOLDE --- */
    function abrirModalEditar(index) {
      const item = dadosAbaAtual[index];
      if (!item) {
        alert("Item não encontrado!");
        return;
      }

      const col1 = obterValorColuna(item, ["LOCAL", "Local", "molde número", "molde numero", "molde", "numero"], 0);
      const col2 = obterValorColuna(item, ["CÓDIGO", "Código", "CODIGO", "código", "codigo"], 1);
      const col3 = obterValorColuna(item, ["DESCRIÇÃO", "Descrição", "DESCRICAO", "descrição", "descricao"], 2);

      document.getElementById("editRowIndex").value = item._rowIndex;
      document.getElementById("editLocal").value = col1;
      document.getElementById("editCodigo").value = col2;
      document.getElementById("editDescricao").value = col3;
      document.getElementById("modalEditarMolde").style.display = "flex";
    }

    function fecharModalEditar() {
      document.getElementById("modalEditarMolde").style.display = "none";
    }

    function salvarEdicaoMolde() {
      const rIndex = document.getElementById("editRowIndex").value;
      const col1 = document.getElementById("editLocal").value.trim();
      const col2 = document.getElementById("editCodigo").value.trim();
      const col3 = document.getElementById("editDescricao").value.trim();

      if (!col1 || !col2 || !col3) {
        alert("Por favor, preencha todos os campos!");
        return;
      }

      const url = `${BASE_API}?action=EDITAR_MOLDE&sheet=${encodeURIComponent(abaAtual)}&rowIndex=${rIndex}&col1=${encodeURIComponent(col1)}&col2=${encodeURIComponent(col2)}&col3=${encodeURIComponent(col3)}&callback=retornoAcao`;
      executarJSONP(url);
    }

    /* --- EXCLUIR MOLDE --- */
    function excluirMolde(index) {
      const item = dadosAbaAtual[index];
      if (!item) return;

      const col2 = obterValorColuna(item, ["CÓDIGO", "Código", "CODIGO", "código", "codigo"], 1);

      if (confirm(`Tem certeza que deseja excluir o molde '${col2}'?`)) {
        const url = `${BASE_API}?action=EXCLUIR_MOLDE&sheet=${encodeURIComponent(abaAtual)}&rowIndex=${item._rowIndex}&callback=retornoAcao`;
        executarJSONP(url);
      }
    }

    /* --- ENVIAR PARA FERRAMENTARIA --- */
    function abrirModalFerramentaria(index) {
      const item = dadosAbaAtual[index];
      if (!item) return;

      const col1 = obterValorColuna(item, ["LOCAL", "Local", "molde número", "molde numero", "molde", "numero"], 0);
      const col2 = obterValorColuna(item, ["CÓDIGO", "Código", "CODIGO", "código", "codigo"], 1);
      const col3 = obterValorColuna(item, ["DESCRIÇÃO", "Descrição", "DESCRICAO", "descrição", "descricao"], 2);

      document.getElementById("ferrRowIndex").value = item._rowIndex;
      document.getElementById("ferrLocal").value = col1;
      document.getElementById("ferrCodigo").value = col2;
      document.getElementById("ferrDescricao").value = col3;
      
      const agora = new Date();
      document.getElementById("ferrData").value = agora.toISOString().split('T')[0];
      document.getElementById("ferrHora").value = agora.toTimeString().substring(0,5);
      
      if (usuarioLogado) {
        document.getElementById("ferrSolicitante").value = usuarioLogado.user || "";
      }

      document.getElementById("modalFerramentaria").style.display = "flex";
    }

    function fecharModalFerramentaria() {
      document.getElementById("modalFerramentaria").style.display = "none";
      document.getElementById("ferrTipos").value = "";
      document.getElementById("ferrObs").value = "";
    }

    function confirmarEnvioFerramentaria() {
      const rIndex = document.getElementById("ferrRowIndex").value;
      const local = document.getElementById("ferrLocal").value;
      const codigo = document.getElementById("ferrCodigo").value;
      const descricao = document.getElementById("ferrDescricao").value;
      
      const data = document.getElementById("ferrData").value;
      const hora = document.getElementById("ferrHora").value;
      const solicitante = document.getElementById("ferrSolicitante").value.trim();
      const tipos = document.getElementById("ferrTipos").value.trim();
      const obs = document.getElementById("ferrObs").value.trim();

      if (!solicitante) {
        alert("Informe o nome do solicitante!");
        return;
      }

      const url = `${BASE_API}?action=SOLICITAR_FERRAMENTARIA` +
                  `&abaOrigem=${encodeURIComponent(abaAtual)}` +
                  `&rowIndex=${rIndex}` +
                  `&col1=${encodeURIComponent(local)}` +
                  `&col2=${encodeURIComponent(codigo)}` +
                  `&col3=${encodeURIComponent(descricao)}` +
                  `&data=${encodeURIComponent(data)}` +
                  `&hora=${encodeURIComponent(hora)}` +
                  `&solicitante=${encodeURIComponent(solicitante)}` +
                  `&tipos=${encodeURIComponent(tipos)}` +
                  `&obs=${encodeURIComponent(obs)}` +
                  `&callback=retornoAcao`;

      executarJSONP(url);
    }

    /* --- CALLBACK GERAL PARA AÇÕES --- */
    function retornoAcao(res) {
      if (res && res.status === "success") {
        alert(res.osNumber ? `Solicitação enviada com sucesso! OS Gerada: ${res.osNumber}` : "Operação realizada com sucesso!");
        fecharModalAdicionar();
        fecharModalEditar();
        fecharModalFerramentaria();
        fecharModalLiberar();
        carregarDadosAba(abaAtual);
      } else {
        alert("Erro na operação: " + (res && res.message ? res.message : "Erro desconhecido."));
      }
    }
  </script>
</body>
</html>
